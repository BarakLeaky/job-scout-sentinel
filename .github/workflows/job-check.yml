name: Job Alert Check

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd src
          pip install -r ../requirements.txt

      - name: Run job alert script
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          cd src
          python3 main.py

      - name: Record last successful check
        if: success()
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > data/last_checked.txt

      - name: Commit updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json data/last_checked.txt
          git diff --staged --quiet || git commit -m "chore: update seen jobs and last-checked timestamp"
          git push
